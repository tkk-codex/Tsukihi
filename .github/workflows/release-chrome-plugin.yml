name: Release Chrome Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (optional)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Prepare zip
        id: zip
        run: |
          TAG=${GITHUB_REF##*/}
          ZIP_NAME="${{ github.repository }}-${TAG}.zip"
          mkdir -p release
          zip -r "release/${ZIP_NAME}" . -x ".git/*" ".github/*" "node_modules/*" "release/*" "*.zip" "*.crx" "*.pem"
          echo "zip_path=release/${ZIP_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.zip.outputs.zip_path }}
          asset_name: ${{ steps.zip.outputs.zip_path }}
          asset_content_type: application/zip
